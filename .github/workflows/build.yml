name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest 2>/dev/null || true
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install Android Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -o Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Download Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable/
          unzip -o Godot_v4.7.2-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.7.2.stable/

      - name: Extract Project
        run: |
          mkdir -p project
          unzip -o project-full.zip -d project/
          ls -la project/
          ls -la project/android/build/ || echo "No android/build folder"
          ls -la project/android/build/libs/ 2>/dev/null || echo "No libs folder"

      - name: Download Godot AAR Library
        run: |
          cd ~/.local/share/godot/export_templates/4.7.2.stable/
          mkdir -p android_source
          unzip -o android_source.zip -d android_source/
          find android_source -name "*.aar" -exec ls -la {} \;
          mkdir -p $GITHUB_WORKSPACE/project/android/build/libs/debug
          mkdir -p $GITHUB_WORKSPACE/project/android/build/libs/release
          find android_source -name "godot-lib.template_debug.aar" -exec cp {} $GITHUB_WORKSPACE/project/android/build/libs/debug/ \;
          find android_source -name "godot-lib.template_release.aar" -exec cp {} $GITHUB_WORKSPACE/project/android/build/libs/release/ \;
          ls -la $GITHUB_WORKSPACE/project/android/build/libs/debug/

      - name: Enable ETC2/ASTC
        run: |
          cd project
          if grep -q "\[rendering\]" project.godot; then
            sed -i '/^\[rendering\]/a textures/vram_compression/import_etc2_astc=true' project.godot
          else
            echo "" >> project.godot
            echo "[rendering]" >> project.godot
            echo "textures/vram_compression/import_etc2_astc=true" >> project.godot
          fi
          cd ..

      - name: Setup Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$HOME/android-sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Create Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Fix Missing Icons
        run: |
          python3 << 'PYEOF'
          import os
          import shutil

          base = 'project/android/build/src/main/res'
          for folder in os.listdir(base):
              path = os.path.join(base, folder)
              if not os.path.isdir(path):
                  continue
              files = os.listdir(path)
              for f in files:
                  if 'icon_foreground' in f:
                      ext = os.path.splitext(f)[1]
                      bg_name = f.replace('foreground', 'background')
                      bg_path = os.path.join(path, bg_name)
                      if not os.path.exists(bg_path):
                          icon_path = os.path.join(path, 'icon' + ext)
                          if os.path.exists(icon_path):
                              shutil.copy(icon_path, bg_path)
                              print(f"Created {bg_path}")
          print("Done!")
          PYEOF

      - name: Fix Gradle Permissions
        run: |
          chmod +x project/android/build/gradlew || true

      - name: Import Project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path project --import --quit || true

      - name: Build APK
        run: |
          mkdir -p build
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path project --export-debug "Android" ../build/RahBiRah.apk
          ls -la build/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RahBiRah-APK
          path: build/RahBiRah.apk
